        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            transition: var(--transition);
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(160px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
            transition: var(--transition);
        }
        .glow-1 {
            width: 550px; height: 550px;
            background: radial-gradient(circle, var(--glow-1), transparent 70%);
            top: 5%; left: 15%;
            animation: drift-1 22s ease-in-out infinite;
        }
        .glow-2 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, var(--glow-2), transparent 70%);
            bottom: 0%; right: 10%;
            animation: drift-2 28s ease-in-out infinite;
        }
        .glow-3 {
            width: 380px; height: 380px;
            background: radial-gradient(circle, var(--glow-3), transparent 70%);
            top: 55%; left: 55%;
            animation: drift-3 18s ease-in-out infinite;
        }

        @keyframes drift-1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, -40px) scale(1.2); }
        }
        @keyframes drift-2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-40px, 30px) scale(1.15); }
        }
        @keyframes drift-3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 50px) scale(0.9); }
        }

        .main {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .theme-toggle {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 5;
        }
        .theme-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 15px;
            line-height: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .theme-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow), 0 2px 8px rgba(0,0,0,0.15);
            transform: rotate(20deg) scale(1.1);
        }
        .theme-btn:active {
            transform: rotate(0deg) scale(0.92);
        }
        .theme-panel {
            position: absolute;
            top: 42px;
            right: 0;
            background: var(--glass);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 10px;
            min-width: 155px;
            box-shadow: var(--shadow);
            opacity: 0;
            transform: translateY(-8px) scale(0.95);
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .theme-panel.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .theme-panel::before {
            content: '';
            position: absolute;
            top: -5px; right: 14px;
            width: 8px; height: 8px;
            background: var(--glass);
            border-left: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-border);
            transform: rotate(45deg);
            backdrop-filter: blur(40px) saturate(200%);
        }
        .theme-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 12px;
            font-weight: 500;
            color: #1d1d1f;
            border: 1.5px solid transparent;
        }
        .theme-item:hover {
            background: rgba(0,0,0,0.05);
        }
        .theme-item.active {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: var(--accent);
        }
        .theme-dot {
            width: 13px; height: 13px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
        }
        .theme-item:hover .theme-dot {
            transform: scale(1.15);
        }
        .theme-item.active .theme-dot {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow), inset 0 1px 2px rgba(0,0,0,0.2);
        }
        .theme-dot.dark { background: #0a0a0f; border-color: rgba(255,255,255,0.15); }
        .theme-dot.light { background: #f5f5f7; border-color: rgba(0,0,0,0.1); }
        .theme-dot.neon { background: #0c0c1a; border-color: rgba(139,92,246,0.4); }
        .theme-dot.warm { background: #1a1210; border-color: rgba(251,146,60,0.4); }
        .theme-dot.ocean { background: #0a1628; border-color: rgba(56,189,248,0.4); }
        .theme-dot.sakura { background: #1a1015; border-color: rgba(244,114,182,0.4); }
        .theme-dot.forest { background: #0f1a12; border-color: rgba(74,222,128,0.4); }

        .capsule-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        .capsule {
            background: var(--capsule-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--capsule-border);
            border-radius: 999px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--capsule-text);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: default;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .capsule.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 28px var(--accent-glow);
        }
        .capsule.error {
            background: rgba(255, 71, 87, 0.06);
            border-color: var(--danger);
            color: var(--danger);
            box-shadow: 0 0 28px var(--danger-glow);
        }
        .capsule.success {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--success);
            box-shadow: 0 0 32px var(--accent-glow);
        }
        .capsule-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
            transition: all 0.3s ease;
        }
        .capsule.active .capsule-dot {
            animation: pulse-dot 1.5s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.6); }
        }
        .capsule-spinner {
            width: 14px; height: 14px;
            border: 2px solid var(--input-border);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .card {
            background: var(--glass);
            backdrop-filter: blur(48px) saturate(220%);
            -webkit-backdrop-filter: blur(48px) saturate(220%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 40px 30px 30px;
            box-shadow: var(--shadow);
            transition: all 0.35s ease, background 0.5s ease, border-color 0.4s ease;
            position: relative;
            overflow: visible;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--top-line), transparent);
            transition: var(--transition);
        }
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            background: radial-gradient(ellipse at 50% 0%, var(--glass-highlight), transparent 60%);
            pointer-events: none;
            opacity: 0.6;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .card-header {
            position: relative;
            margin-bottom: 30px;
            z-index: 1;
        }
        .card-title {
            font-size: 30px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.03em;
            text-align: center;
            line-height: 1.2;
            transition: var(--transition);
        }

        .input-wrap {

        .input-box input:focus {

        .btn-go {

        .btn-go::after {
            content: '';

            transition: left 0.6s ease;

        .btn-go:hover::after {

        .btn-go:hover {

        .btn-go:active {

        .btn-go.loading svg {
            animation: bounce 0.6s ease-in-out infinite;

        @keyframes bounce {

        .progress-wrap {
            margin-top: 26px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.45s ease;
            pointer-events: none;
            position: relative;
            z-index: 1;
        }
        .progress-wrap.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-dim);
            letter-spacing: 0.02em;
            transition: var(--transition);
        }
        .progress-track {
            width: 100%;
            height: 5px;
            background: var(--progress-track);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent));
            border-radius: 999px;
            transition: width 0.45s cubic-bezier(0.25, 0.1, 0.25, 1);
            width: 0%;
            position: relative;
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0; top: 0;
            width: 24px; height: 100%;
            background: linear-gradient(90deg, transparent, var(--shimmer));
            border-radius: 999px;
            animation: shimmer 1.2s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .queue {
            margin-top: 14px;
            opacity: 0;
            transform: translateY(6px);
            transition: all 0.35s ease;
            position: relative;
            z-index: 1;
        }
        .queue.show {
            opacity: 1;
            transform: translateY(0);
        }
        .queue-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: var(--queue-bg);
            backdrop-filter: blur(8px);
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-dim);
            transition: all 0.25s ease, background 0.4s ease;
            border: 1px solid transparent;
            animation: slideIn 0.35s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .queue-item.ok {
            color: var(--success);
            background: var(--accent-dim);
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);

        .queue-item.err {
            color: var(--danger);

            border-color: var(--danger);

        .queue-item .q-icon {

            width: 18px; height: 18px;

        .hint {

        @media (max-width: 480px) {
            .card { padding: 30px 20px 24px; border-radius: 20px; }
            .card-title { font-size: 26px; }
            .input-box input { height: 50px; font-size: 14px; }
            .btn-go { width: 50px; height: 50px; }
            .btn-go svg { width: 20px; height: 20px; }
            .theme-toggle { top: 14px; right: 14px; }
            .theme-btn { width: 32px; height: 32px; font-size: 14px; }
            .theme-panel { top: 40px; }
            .qr-modal { padding: 24px; }
            .qr-img-wrap { width: 160px; height: 160px; }
            .qr-img-wrap img { width: 140px; height: 140px; }
        }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <div class="main">
        <div class="capsule-wrapper">
            <div class="capsule" id="capsule">
                <span class="capsule-dot" id="capDot"></span>

            </div>

                <div class="theme-panel" id="themePanel">
                    <div class="theme-item" data-theme="dark">

                    </div>
                    <div class="theme-item" data-theme="neon">
                        <span class="theme-dot neon"></span>

                    </div>
                    <div class="theme-item" data-theme="warm">
                        <span class="theme-dot warm"></span>
                        <span>暖日橙</span>
                    </div>
                    <div class="theme-item" data-theme="ocean">
                        <span class="theme-dot ocean"></span>

                    <div class="theme-item" data-theme="sakura">
                        <span class="theme-dot sakura"></span>

            </div>

            <div class="card-header">
                <h1 class="card-title">网易云下载器</h1>
            </div>

            <div class="login-area" id="loginArea">
                <button class="login-btn" id="loginBtn">
                    <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    扫码登录
                </button>
            </div>

                <div class="input-box">
                    <input type="text" id="input" placeholder="输入音乐ID或链接" autocomplete="off">
                    <button class="input-clear" id="clear">&#10005;</button>
                </div>
                <button class="btn-go" id="btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 3v12m0 0l-4-4m4 4l4-4"/>
                        <line x1="5" y1="17" x2="19" y2="17"/>
                    </svg>
                </button>
            </div>

            <div class="progress-wrap" id="progWrap">
                <div class="progress-meta">
                    <span id="progLabel">正在下载...</span>
                    <span id="progPct">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progFill"></div>
                </div>
            </div>

            <div class="queue" id="queue"></div>
        </div>

        <p class="hint">支持批量下载，多个ID用逗号分隔</p>
    </div>

    <div class="qr-overlay" id="qrOverlay">
        <div class="qr-modal">
            <h3>网易云扫码登录</h3>
            <p class="qr-sub">悲报：网易云解灰似了，只能登录VIP账号来下载VIP歌曲了</p>
            <div class="qr-img-wrap" id="qrWrap">
                <div class="qr-placeholder" id="qrPlaceholder"></div>
                <img id="qrImg" style="display:none;" alt="二维码">
                <div class="qr-refresh" id="qrRefresh">
                    <span>二维码已过期</span>
                    <button id="qrRefreshBtn">刷新二维码</button>
                </div>
            </div>
            <div class="qr-status" id="qrStatus">正在获取二维码...</div>
            <button class="qr-close" id="qrClose">取消</button>
        </div>
    </div>

    <script>
    (function() {
        const themes = ['dark', 'light', 'neon', 'warm', 'ocean', 'sakura', 'forest'];
        let currentTheme = localStorage.getItem('music-theme') || 'dark';

        function applyTheme(name) {
            document.body.setAttribute('data-theme', name);
            currentTheme = name;
            localStorage.setItem('music-theme', name);
            document.querySelectorAll('.theme-item').forEach(el => {
                el.classList.toggle('active', el.dataset.theme === name);
            });
        }

        const themeBtn = document.getElementById('themeBtn');
        const themePanel = document.getElementById('themePanel');

        themeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            themePanel.classList.toggle('open');
        });

        document.querySelectorAll('.theme-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                applyTheme(item.dataset.theme);
                themePanel.classList.remove('open');
            });
        });

        document.addEventListener('click', () => {
            themePanel.classList.remove('open');
        });

        applyTheme(currentTheme);

        const API = 'https://api.91videos.vip';
        const LEVEL = 'jymaster';
        const UNBLOCK = 'true';

        const capsule = document.getElementById('capsule');
        const capText = document.getElementById('capText');
        const input = document.getElementById('input');
        const clearBtn = document.getElementById('clear');
        const btn = document.getElementById('btn');
        const progWrap = document.getElementById('progWrap');
        const progLabel = document.getElementById('progLabel');
        const progPct = document.getElementById('progPct');
        const progFill = document.getElementById('progFill');
        const queue = document.getElementById('queue');
        const loginArea = document.getElementById('loginArea');
        const loginBtn = document.getElementById('loginBtn');
        const qrOverlay = document.getElementById('qrOverlay');
        const qrWrap = document.getElementById('qrWrap');
        const qrImg = document.getElementById('qrImg');
        const qrPlaceholder = document.getElementById('qrPlaceholder');
        const qrRefresh = document.getElementById('qrRefresh');
        const qrRefreshBtn = document.getElementById('qrRefreshBtn');
        const qrStatus = document.getElementById('qrStatus');
        const qrClose = document.getElementById('qrClose');

        let downloading = false;
        let abortCtrl = null;
        let qrTimer = null;
        let checkTimer = null;
        let currentCookie = localStorage.getItem('music-cookie') || '';
        let currentUser = null;
        try {
            currentUser = JSON.parse(localStorage.getItem('music-user'));
        } catch(e) { currentUser = null; }

        function updateLoginUI() {
            if (currentUser && currentUser.nickname) {
                loginArea.innerHTML = `
                    <div class="user-badge">
                        <img class="avatar" src="${currentUser.avatarUrl || ''}" alt="avatar" onerror="this.style.display='none'">
                        <span>${currentUser.nickname}</span>
                        <button class="logout-btn" id="logoutBtn" title="退出登录">&#10005;</button>
                    </div>
                `;
                document.getElementById('logoutBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    logout();
                });
            } else {
                loginArea.innerHTML = `
                    <button class="login-btn" id="loginBtn">
                        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                        扫码登录
                    </button>
                `;
                document.getElementById('loginBtn').addEventListener('click', openQrLogin);
            }
        }

        function logout() {
            currentCookie = '';
            currentUser = null;
            localStorage.removeItem('music-cookie');
            localStorage.removeItem('music-user');
            updateLoginUI();
            setCap('', '已退出登录');
            setTimeout(() => setCap('', '准备就绪'), 2000);
        }

        function setCap(state, text) {
            capsule.className = 'capsule' + (state ? ' ' + state : '');
            capText.textContent = text;
            if (state === 'active') {
                if (!capsule.querySelector('.capsule-spinner')) {
                    const sp = document.createElement('span');
                    sp.className = 'capsule-spinner';
                    capsule.insertBefore(sp, capText);
                }
            } else {
                const sp = capsule.querySelector('.capsule-spinner');
                if (sp) sp.remove();
            }
        }

        function extractId(raw) {
            const t = raw.trim();
            if (!t) return null;
            const m = t.match(/[?&]id=(\d+)/) || t.match(/\/song\/(\d+)/) || t.match(/^(\d+(?:,\d+)*)$/);
            return m ? m[1] : null;
        }

        function updateClear() {
            clearBtn.classList.toggle('visible', input.value.trim().length > 0);
        }
        input.addEventListener('input', updateClear);
        input.addEventListener('focus', updateClear);
        input.addEventListener('blur', () => setTimeout(updateClear, 150));
        clearBtn.addEventListener('click', () => { input.value = ''; updateClear(); input.focus(); });
        input.addEventListener('keydown', e => { if (e.key === 'Enter' && !downloading) btn.click(); });

        function resetProg() {
            progWrap.classList.remove('show');
            progFill.style.width = '0%';
            progPct.textContent = '0%';
            progLabel.textContent = '正在下载...';
            queue.classList.remove('show');
            queue.innerHTML = '';
        }
        function setProg(pct, label) {
            progWrap.classList.add('show');
            progFill.style.width = Math.min(100, Math.max(0, pct)) + '%';
            progPct.textContent = Math.round(pct) + '%';
            if (label) progLabel.textContent = label;
        }

        function openQrLogin() {
            qrOverlay.classList.add('open');
            qrImg.style.display = 'none';
            qrPlaceholder.style.display = 'block';
            qrRefresh.classList.remove('show');
            qrStatus.textContent = '正在获取二维码...';
            qrStatus.className = 'qr-status';
            startQrLogin();
        }

        function closeQrLogin() {
            qrOverlay.classList.remove('open');
            if (qrTimer) { clearTimeout(qrTimer); qrTimer = null; }
            if (checkTimer) { clearInterval(checkTimer); checkTimer = null; }
        }

        qrClose.addEventListener('click', closeQrLogin);
        qrOverlay.addEventListener('click', (e) => {
            if (e.target === qrOverlay) closeQrLogin();
        });
        qrRefreshBtn.addEventListener('click', () => {
            qrRefresh.classList.remove('show');
            qrImg.style.display = 'none';
            qrPlaceholder.style.display = 'block';
            qrStatus.textContent = '正在获取二维码...';
            qrStatus.className = 'qr-status';
            startQrLogin();
        });

        async function startQrLogin() {
            try {
                const keyResp = await fetch(`${API}/login/qr/key?timestamp=${Date.now()}`);
                if (!keyResp.ok) throw new Error('获取二维码key失败');
                const keyData = await keyResp.json();
                const unikey = keyData?.data?.unikey;
                if (!unikey) throw new Error('未获取到unikey');

                const qrResp = await fetch(`${API}/login/qr/create?key=${encodeURIComponent(unikey)}&qrimg=true&timestamp=${Date.now()}`);
                if (!qrResp.ok) throw new Error('生成二维码失败');
                const qrData = await qrResp.json();
                const qrimg = qrData?.data?.qrimg;
                if (!qrimg) throw new Error('未获取到二维码图片');

                qrPlaceholder.style.display = 'none';
                qrImg.src = qrimg;
                qrImg.style.display = 'block';
                qrStatus.textContent = '等待扫码...';
                qrStatus.className = 'qr-status waiting';

                if (checkTimer) clearInterval(checkTimer);
                checkTimer = setInterval(async () => {
                    try {
                        const checkResp = await fetch(`${API}/login/qr/check?key=${encodeURIComponent(unikey)}&timestamp=${Date.now()}`);
                        if (!checkResp.ok) return;
                        const checkData = await checkResp.json();

                        if (checkData.code === 800) {
                            clearInterval(checkTimer);
                            checkTimer = null;
                            qrRefresh.classList.add('show');
                            qrStatus.textContent = '二维码已过期，请刷新';
                            qrStatus.className = 'qr-status error';
                        } else if (checkData.code === 801) {
                            qrStatus.textContent = '等待扫码...';
                            qrStatus.className = 'qr-status waiting';
                        } else if (checkData.code === 802) {
                            qrStatus.textContent = '扫码成功，请在手机上确认登录';
                            qrStatus.className = 'qr-status scanning';
                        } else if (checkData.code === 803) {
                            clearInterval(checkTimer);
                            checkTimer = null;
                            qrStatus.textContent = '登录成功！';
                            qrStatus.className = 'qr-status success';

                            const cookie = checkData.cookie || '';
                            if (cookie) {
                                currentCookie = cookie;
                                localStorage.setItem('music-cookie', cookie);
                                await fetchUserInfo(cookie);
                            }

                            setTimeout(() => {
                                closeQrLogin();
                                updateLoginUI();
                                setCap('success', '登录成功');
                                setTimeout(() => setCap('', '准备就绪'), 3000);
                            }, 800);
                        }
                    } catch (err) {
                        console.error('轮询出错:', err);
                    }
                }, 3000);

                if (qrTimer) clearTimeout(qrTimer);
                qrTimer = setTimeout(() => {
                    if (checkTimer) {
                        clearInterval(checkTimer);
                        checkTimer = null;
                        qrRefresh.classList.add('show');
                        qrStatus.textContent = '二维码已过期，请刷新';
                        qrStatus.className = 'qr-status error';
                    }
                }, 300000);

            } catch (err) {
                qrStatus.textContent = '获取二维码失败: ' + err.message;
                qrStatus.className = 'qr-status error';
                qrPlaceholder.style.display = 'none';
            }
        }

        async function fetchUserInfo(cookie) {
            try {
                const resp = await fetch(`${API}/login/status?timestamp=${Date.now()}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ cookie })
                });
                if (!resp.ok) return;
                const data = await resp.json();
                if (data?.data?.profile) {
                    currentUser = data.data.profile;
                    localStorage.setItem('music-user', JSON.stringify(currentUser));
                }
            } catch (e) {
                console.error('获取用户信息失败:', e);
            }
        }

        if (currentCookie) {
            fetchUserInfo(currentCookie).then(() => updateLoginUI());
        } else {
            updateLoginUI();
        }

        loginBtn.addEventListener('click', openQrLogin);

        async function fetchUrl(id) {
            let url = `${API}/song/url/v1?id=${encodeURIComponent(id)}&level=${LEVEL}&timestamp=${Date.now()}`;
            if (currentCookie) {
                url += `&cookie=${encodeURIComponent(currentCookie)}`;
            } else {
                url += `&unblock=${UNBLOCK}`;
            }
            const resp = await fetch(url, { signal: abortCtrl?.signal, referrerPolicy: 'no-referrer' });
            if (!resp.ok) throw new Error('API请求失败');
            const json = await resp.json();
            let musicUrl = null;
            if (json?.data) {
                if (Array.isArray(json.data)) {
                    const entry = json.data.find(e => String(e.id) === String(id));
                    musicUrl = entry?.url || json.data[0]?.url;
                } else if (typeof json.data === 'object') {
                    musicUrl = json.data.url || json.data[id]?.url;
                } else if (typeof json.data === 'string') {
                    musicUrl = json.data;
                }
            }
            if (!musicUrl && json?.url) musicUrl = json.url;
            if (!musicUrl) throw new Error('未找到音乐URL');
            return musicUrl;
        }

        async function fetchSongDetails(ids) {
            const url = `${API}/song/detail?ids=${encodeURIComponent(ids.join(','))}&timestamp=${Date.now()}`;
            const resp = await fetch(url, { signal: abortCtrl?.signal, referrerPolicy: 'no-referrer' });
            if (!resp.ok) throw new Error('获取歌曲详情失败');
            const json = await resp.json();
            const map = {};
            if (json?.songs && Array.isArray(json.songs)) {
                json.songs.forEach(song => {
                    const rawName = song.name || String(song.id);
                    const safeName = rawName.replace(/[\\/:*?"<>|]/g, '_').trim() || String(song.id);
                    map[String(song.id)] = safeName;
                });
            }
            ids.forEach(id => {
                if (!map[id]) map[id] = id;
            });
            return map;
        }

        async function dlBlob(url, filename, onProg) {
            const resp = await fetch(url, { signal: abortCtrl?.signal, referrerPolicy: 'no-referrer' });
            if (!resp.ok) throw new Error('文件请求失败');
            const total = resp.headers.get('content-length') ? parseInt(resp.headers.get('content-length'), 10) : null;
            let received = 0;
            const reader = resp.body.getReader();
            const chunks = [];
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                received += value.length;
                if (total && onProg) onProg(Math.round((received / total) * 100));
            }
            const blob = new Blob(chunks);
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
        }

        function dlDirect(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.referrerPolicy = 'no-referrer';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function processOne(id, songMap) {
            const url = await fetchUrl(id);
            const filename = (songMap?.[id] || id) + '.mp3';
            try {
                await dlBlob(url, filename, pct => setProg(pct, `下载中: ${filename}`));
            } catch (e) {
                if (e.name === 'AbortError') throw e;
                dlDirect(url, filename);
                setProg(100, `已触发: ${filename}`);
            }
        }

        function addQueue(id, status, text) {
            const item = document.createElement('div');
            item.className = 'queue-item ' + (status === 'done' ? 'ok' : status === 'failed' ? 'err' : '');
            item.innerHTML = `<span class="q-icon">${status === 'done' ? '&#10003;' : status === 'failed' ? '&#10005;' : '&#9675;'}</span><span>${text}</span>`;
            queue.appendChild(item);
            queue.classList.add('show');
        }

        async function start() {
            if (downloading) return;
            const extracted = extractId(input.value);
            if (!extracted) {
                setCap('error', '请输入有效的音乐ID');
                setTimeout(() => setCap('', '准备就绪'), 2500);
                return;
            }
            const ids = extracted.split(',').map(s => s.trim()).filter(Boolean);
            if (!ids.length) {
                setCap('error', '未识别到ID');
                setTimeout(() => setCap('', '准备就绪'), 2500);
                return;
            }
            downloading = true;
            abortCtrl = new AbortController();
            btn.disabled = true;
            btn.classList.add('loading');
            resetProg();
            setCap('active', ids.length === 1 ? '获取中...' : `共 ${ids.length} 首`);
            setProg(0, '获取歌曲信息...');

            let ok = 0, fail = 0;
            let songMap = {};
            try {
                songMap = await fetchSongDetails(ids);
            } catch (e) {
                console.error('获取歌曲详情失败:', e);
            }
            for (let i = 0; i < ids.length; i++) {
                const id = ids[i];
                const filename = (songMap[id] || id) + '.mp3';
                const base = ids.length > 1 ? Math.round((i / ids.length) * 100) : 0;
                setProg(base, `[${i+1}/${ids.length}] 获取 ${filename}`);
                try {
                    await processOne(id, songMap);
                    ok++;
                    addQueue(id, 'done', `${filename} — 完成`);
                    if (ids.length > 1) setProg(Math.round(((i+1)/ids.length)*100), `[${i+1}/${ids.length}] 完成`);
                    else setProg(100, '下载完成');
                } catch (err) {
                    if (err.name === 'AbortError') {
                        addQueue(id, 'failed', `${filename} — 已取消`);
                        fail++; break;
                    }
                    fail++;
                    addQueue(id, 'failed', `${filename} — ${err.message}`);
                    if (ids.length > 1) setProg(Math.round(((i+1)/ids.length)*100), `[${i+1}/${ids.length}] 失败`);
                }
                if (i < ids.length - 1 && !abortCtrl.signal.aborted) await new Promise(r => setTimeout(r, 800));
            }

            if (abortCtrl.signal.aborted) {
                setCap('error', '已取消');
                setProg(0, '已取消');
            } else if (fail === 0 && ok > 0) {
                setCap('success', ok === 1 ? '下载完成' : `完成 ${ok} 首`);
                setProg(100, ok === 1 ? '下载完成' : `全部 ${ok} 首完成`);
            } else if (ok > 0 && fail > 0) {
                setCap('success', `完成 ${ok} · 失败 ${fail}`);
                setProg(100, `完成 ${ok}，失败 ${fail}`);
            } else {
                setCap('error', '下载失败');
                setProg(0, '下载失败');
            }

            btn.disabled = false;
            btn.classList.remove('loading');
            downloading = false;
            abortCtrl = null;
            setTimeout(() => {
                if (!downloading) {
                    setCap('', '准备就绪');
                    if (progFill.style.width === '100%' || progFill.style.width === '0%') {
                        setTimeout(() => { if (!downloading) resetProg(); }, 3000);
                    }
                }
            }, 3000);
        }

        btn.addEventListener('click', () => {
            if (downloading) {
                if (abortCtrl) { abortCtrl.abort(); setCap('error', '取消中...'); }
                return;
            }
            start();
        });

        updateClear();
        setCap('', '准备就绪');
    })();
    </script>
</body>
